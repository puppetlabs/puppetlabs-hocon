---
name: "ci"

on:
  pull_request:
    branches:
      - 'master'
      - 'main'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'CODEOWNERS'
      - 'AUTHORS'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Spec:
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    secrets: "inherit"

  Acceptance:
    needs: Spec
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_acceptance.yml@main"
    secrets: "inherit"
    with:
      runs_on: "ubuntu-26.04"
      flags: >-
        --arch-exclude arm
        --collection-platform-exclude '9:^(Debian-(10|11|12)|Ubuntu-(18\.04|20\.04)|RedHat-7|OracleLinux-7|Scientific-7)$'
        --collection-platform-exclude '8:^Ubuntu-26\.04$'
